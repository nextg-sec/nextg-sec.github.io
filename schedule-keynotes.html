<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>NextG-Sec 2026: Keynotes</title>
  <meta name="description" content="NextG-Sec 2026 Workshop - Keynote Speakers">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/normalize.css">
  <link rel="stylesheet" href="css/skeleton.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/dropdown.css">
  <style>
    .keynote-card {
      display: flex;
      gap: 28px;
      align-items: flex-start;
      margin-bottom: 48px;
      padding-bottom: 40px;
      border-bottom: 1px solid #e8e8e8;
    }
    .keynote-card:last-child {
      border-bottom: none;
    }
    .keynote-photo {
      flex-shrink: 0;
      width: 150px;
    }
    .keynote-photo img {
      width: 150px;
      height: 150px;
      object-fit: cover;
      border-radius: 4px;
      border: 1px solid #ddd;
    }
    .keynote-info h3 {
      margin-top: 0;
      margin-bottom: 2px;
      color: #333;
    }
    .keynote-affiliation {
      color: #555;
      font-size: 0.95em;
      margin: 0 0 12px;
    }
    .keynote-talk-title {
      font-style: italic;
      font-weight: 600;
      margin-bottom: 10px;
      color: #2567d8;
    }
    .keynote-section-label {
      font-weight: 600;
      color: #333;
      margin-top: 12px;
      margin-bottom: 4px;
    }
    .keynote-abstract,
    .keynote-bio {
      font-size: 0.95em;
      line-height: 1.6;
      color: #444;
      margin: 0 0 10px;
    }
    .schedule-tabs {
      display: flex;
      gap: 0;
      margin-bottom: 30px;
      border-bottom: 2px solid #2567d8;
    }
    .schedule-tab {
      padding: 8px 24px;
      font-size: 1em;
      font-weight: 600;
      color: #2567d8;
      text-decoration: none;
      border: 1px solid #ddd;
      border-bottom: none;
      background: #f9f9f9;
      border-radius: 4px 4px 0 0;
      margin-right: 4px;
    }
    .schedule-tab.active {
      background: #2567d8;
      color: #fff;
      border-color: #2567d8;
    }
    .schedule-tab:hover:not(.active) {
      background: #e8f0fb;
      text-decoration: none;
    }
    @media (max-width: 600px) {
      .keynote-card {
        flex-direction: column;
      }
      .keynote-photo {
        width: 100%;
      }
      .keynote-photo img {
        width: 120px;
        height: 120px;
      }
    }
  </style>
</head>

<body>
  <header class="site-header">
    <div class="container">
      <div class="row">
        <img class="header-image u-max-full-width" src="images/nextg-sec-banner.jpg" alt="NextG-Sec 2026">
      </div>
    </div>
  </header>

  <header class="site-menu">
    <div id="menu"></div>
    <script>
      fetch("components/menu.html")
        .then(response => response.text())
        .then(data => { document.getElementById("menu").innerHTML = data; });
    </script>
  </header>

  <div class="container">
    <div class="page">
      <h2>Schedule</h2>

      <div class="schedule-tabs">
        <a class="schedule-tab active" href="schedule-keynotes.html">Keynotes</a>
        <a class="schedule-tab" href="schedule-panel.html">Panel</a>
      </div>

      <div id="keynotes-list"></div>
    </div>
  </div>

  <footer class="site-footer">
    <div id="sponsors"></div>
    <script>
      fetch("components/sponsors.html")
        .then(response => response.text())
        .then(data => { document.getElementById("sponsors").innerHTML = data; });
    </script>
  </footer>

  <script>
    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    fetch("schedule/keynotes/data.json")
      .then(r => r.json())
      .then(speakers => {
        const container = document.getElementById("keynotes-list");
        container.innerHTML = speakers.map(s => `
          <div class="keynote-card">
            <div class="keynote-photo">
              <img src="schedule/keynotes/${escapeHtml(s.photo)}" alt="${escapeHtml(s.name)}">
            </div>
            <div class="keynote-info">
              <h3>${escapeHtml(s.name)}</h3>
              <p class="keynote-affiliation">${escapeHtml(s.affiliation)}</p>
              <p class="keynote-talk-title">&ldquo;${escapeHtml(s.title)}&rdquo;</p>
              <p class="keynote-section-label">Abstract</p>
              <p class="keynote-abstract">${escapeHtml(s.abstract)}</p>
              <p class="keynote-section-label">Bio</p>
              <p class="keynote-bio">${escapeHtml(s.bio)}</p>
            </div>
          </div>
        `).join("");
      });
  </script>
</body>

</html>
